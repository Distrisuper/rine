services:
  app:
    build: .
    container_name: rine-print-manager
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - APP_NAME=${APP_NAME}
      - INVOICE_BASE_URL=${INVOICE_BASE_URL}
      - LOG_LEVEL=${LOG_LEVEL}
      - RINE_MOCK_PRINTERS=0
      - DEBUG=${DEBUG:-false}
      - CUPS_SERVER=${CUPS_SERVER}
    ports:
      - "8000:8000"
    volumes:
      - ./domain:/app/domain
      - ./application:/app/application
      - ./infrastructure:/app/infrastructure
      - ./workers:/app/workers
      - ./.data:/app/.data
      - /var/run/cups:/var/run/cups
    restart: always

  status-worker:
    build:
      context: .
      dockerfile: Dockerfile.status
    container_name: rine-status-worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - APP_NAME=${APP_NAME}
      - INVOICE_BASE_URL=${INVOICE_BASE_URL}
      - LOG_LEVEL=${LOG_LEVEL}
      - RINE_MOCK_PRINTERS=0
      - DEBUG=${DEBUG:-false}
      - CUPS_SERVER=${CUPS_SERVER}
    volumes:
      - ./domain:/app/domain
      - ./application:/app/application
      - ./infrastructure:/app/infrastructure
      - ./workers:/app/workers
      - ./.data:/app/.data
      - /var/run/cups:/var/run/cups
    restart: always

  print-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: rine-print-worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - APP_NAME=${APP_NAME}
      - INVOICE_BASE_URL=${INVOICE_BASE_URL}
      - LOG_LEVEL=${LOG_LEVEL}
      - RINE_MOCK_PRINTERS=0
      - DEBUG=${DEBUG:-false}
      - CUPS_SERVER=${CUPS_SERVER}
    volumes:
      - ./domain:/app/domain
      - ./application:/app/application
      - ./infrastructure:/app/infrastructure
      - ./workers:/app/workers
      - ./.data:/app/.data
      - /var/run/cups:/var/run/cups
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
    restart: always

  cups:
      build:
        context: .
        dockerfile: docker/cups/Dockerfile
      container_name: rine-cups
      profiles:
      - local
      ports:
        - "631:631"
      volumes:
        # PDFs generados por la impresora "PDF" aparecen en .data/cups-pdf en tu PC
        - ./.data/cups-pdf:/output
      # Opcional: en Windows no hay socket; app/workers usan CUPS_SERVER=cups:631 por red.
      # En Raspberry con CUPS en el host, no levantes este servicio y no definas CUPS_SERVER.

  test:
    build:
      context: .
      target: test
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=${DATABASE_URL_TEST}
      - LOG_LEVEL=DEBUG
      - RINE_MOCK_PRINTERS=1
    volumes:
      - ./domain:/app/domain
      - ./application:/app/application
      - ./infrastructure:/app/infrastructure
      - ./workers:/app/workers
      - ./tests:/app/tests
      - ./.data:/app/.data
    profiles:
      - test
