services:
  redis:
    image: redis:5.0.14-alpine
    container_name: redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: rine-print-manager
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./domain:/app/domain
      - ./application:/app/application
      - ./infrastructure:/app/infrastructure
      - ./infrastructure/templates:/app/templates
      - ./alembic.ini:/app/alembic.ini
      - ./.data:/app/.data
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn infrastructure.presentation.main:app --host 0.0.0.0 --port 8000
      "
    restart: always

volumes:
  redis_data:
    driver: local
