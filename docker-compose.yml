services:
  redis:
    image: redis:5.0.14-alpine
    container_name: redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: always

  app:
    build: .
    container_name: rine-print-manager
    env_file:
      - ./.env
    environment:
      - SQLITE_DB_PATH=/app/data/rine.db
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./data:/app/data
    restart: always

volumes:
  redis_data:
    driver: local
